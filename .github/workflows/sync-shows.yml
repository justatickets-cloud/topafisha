name: Sync Bravo Shows Feed

on:
  schedule:
    # дважды в день: 06:00 и 18:00 (UTC)
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest Shows Feed
        run: node fetch-shows.js
        env:
          BRAVO_FEED_URL: ${{ secrets.BRAVO_FEED_URL }}

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet shows.json; then
            echo "No changes found in shows.json. Skipping commit."
          else
            git add shows.json
            git commit -m "chore: auto-sync shows feed"
            git push origin main
          fi
