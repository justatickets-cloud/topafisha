<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" role="img" aria-label="ТОП Афиша">
  <defs>
    <linearGradient id="taMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d1f4b"/>
      <stop offset="0.55" stop-color="#a63a63"/>
      <stop offset="1" stop-color="#bf9b48"/>
    </linearGradient>
  </defs>

  <!-- Значок (badge) слева (LTR) -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#taMark)"/>
  <rect x="18" y="22" width="28" height="19" rx="5" fill="#ffffff"/>
  <line x1="39" y1="24" x2="39" y2="39" stroke="#bf9b48" stroke-width="2" stroke-dasharray="2 2"/>
  <circle cx="18" cy="31.5" r="2.6" fill="url(#taMark)"/>
  <circle cx="46" cy="31.5" r="2.6" fill="url(#taMark)"/>

  <!-- Текст бренда, выравнивание влево, справа от значка -->
  <text x="72" y="34"
        font-family="Rubik, 'Segoe UI', Arial, sans-serif"
        font-size="26" font-weight="800" fill="#1b1420">ТОП Афиша</text>
  <text x="72" y="52"
        font-family="Arial, 'Segoe UI', sans-serif"
        font-size="11" font-weight="700" letter-spacing="3.5" fill="#a07f2e">TOPAFISHA</text>
</svg>
